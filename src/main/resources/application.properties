spring.application.name=SecureRank
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/securerank_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL55Dialect

# Multipart file upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT Properties
app.jwtSecret=SecureRankSecretKeyForSigningAuthTokensWhichIsLongEnoughForHMACSHA256
app.jwtExpirationMs=86400000

# Logging
logging.level.com.securerank=INFO
